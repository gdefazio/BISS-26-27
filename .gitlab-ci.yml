image: python:3.8-slim

test:
  stage: test
  script:
  - pip install -r requirements.txt
  - sphinx-build -b html . public
  only:
  - branches
  except:
  - master



pages:
  script:
  - pip install -r requirements.txt
  - sphinx-build -d build/doctrees . build/html
  - mv build/html public/
  artifacts:
    paths:
    - public
  only:
  - master
